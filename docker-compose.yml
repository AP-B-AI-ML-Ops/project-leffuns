  #   volumes:
  #     - ./train-and-deploy/data:/workspace/train-and-deploy/data:ro
  #   env_file:
  #     - ./deployment-batch/.env
  #   environment:
  #     - PREFECT_API_URL=http://orchestration:4200/api
  #   depends_on:
  #     - experiment-tracking
  #     - orchestration
  #     - database

volumes:
  postgres-data: